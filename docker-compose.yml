services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    volumes:
      - ./app:/app/app
      - ./workflows:/app/workflows
      - ./uploads:/app/uploads
      - ./generated:/app/generated
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
